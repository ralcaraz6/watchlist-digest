[project]
name = "watchlist-digest"
version = "0.1.0"
description = "A daily, opinionated digest of my personal stock watchlist, built on public market data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rogelio Alcaraz" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
watchlist-digest = "watchlist_digest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
